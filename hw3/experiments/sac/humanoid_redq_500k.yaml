# Ensembled clipped double-Q: two distinct target critics per transition.
# Keep one critic update per transition for comparison with other backups.
base_config: sac
env_name: Humanoid-v4
exp_name: sac_humanoid_redq_500k

num_critic_networks: 10
target_critic_backup_type: redq

total_steps: 500000
random_steps: 5000
training_starts: 10000

batch_size: 256
replay_buffer_capacity: 1000000

hidden_size: 256
num_layers: 3

discount: 0.99
use_soft_target_update: true
soft_target_update_rate: 0.005

actor_gradient_type: reparametrize
num_critic_updates: 1

use_entropy_bonus: true
temperature: 0.05
